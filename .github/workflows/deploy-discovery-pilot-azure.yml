name: Deploy Discovery pilot (Container Apps)

# Manual only. Infrastructure is managed by the Infra workflow (infra/terraform/azure-discovery-pilot); this workflow ships code.
# No stored secret: it signs in with GitHub OIDC as the narrow `discovery-deploy` identity (infra/terraform/platform-identity in
# agentic-resolution-intelligence) from the main-only `pilot-deploy` environment. Every name comes from repository variables.
#
#   mode deploy  build both images (tagged with the commit SHA), push them, point the API and the web app at them
#   mode verify  sign in, log in to the registry and re-apply each app's CURRENT image (a no-op). Proves the identity and its
#                permissions end to end and changes nothing.
#
# After a deploy the Terraform image tags are not out of date: the Infra workflow reads the live tags on every run.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: deploy ships code; verify only checks sign-in and permissions
        required: true
        type: choice
        options:
          - deploy
          - verify
        default: deploy

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pilot-deploy
    env:
      MODE: ${{ inputs.mode }}
      RG: ${{ vars.PILOT_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.PILOT_ACR_NAME }}
      API_APP: ${{ vars.PILOT_API_APP }}
      WEB_APP: ${{ vars.PILOT_WEB_APP }}
      # Web sign-in settings come from the Discovery stack's output (kept in step by the platform identity stack); they are
      # all set or all empty, never typed by hand.
      VITE_ENTRA_CLIENT_ID: ${{ vars.DISCOVERY_ENTRA_CLIENT_ID }}
      VITE_ENTRA_TENANT_ID: ${{ vars.DISCOVERY_ENTRA_TENANT_ID }}
      VITE_ENTRA_API_SCOPE: ${{ vars.DISCOVERY_ENTRA_API_SCOPE }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Check the web sign-in settings are complete
        run: |
          set=0
          for v in "$VITE_ENTRA_CLIENT_ID" "$VITE_ENTRA_TENANT_ID" "$VITE_ENTRA_API_SCOPE"; do [ -n "$v" ] && set=$((set + 1)); done
          if [ "$set" -ne 0 ] && [ "$set" -ne 3 ]; then
            echo "::error::Only $set of the 3 DISCOVERY_ENTRA_* repository variables are set; a partial web sign-in config would break the app."
            exit 1
          fi
          if [ "$set" -eq 0 ]; then echo "Web sign-in settings are empty: building the web app without a token (API auth is off)."; fi
      - name: Log in to the registry
        run: |
          az acr login --name "$ACR_NAME"
          echo "ACR_LOGIN_SERVER=$ACR_NAME.azurecr.io" >> "$GITHUB_ENV"
      - name: Verify (no change)
        if: env.MODE == 'verify'
        run: |
          for app in "$API_APP" "$WEB_APP"; do
            image="$(az containerapp show -n "$app" -g "$RG" --query "properties.template.containers[0].image" -o tsv)"
            echo "$app runs ${image##*/}; re-applying the same image (no-op)"
            az containerapp update -n "$app" -g "$RG" --image "$image" --query "properties.provisioningState" -o tsv
          done
      - name: Build and push the images
        if: env.MODE == 'deploy'
        run: |
          API_IMAGE="$ACR_LOGIN_SERVER/discovery-api:${{ github.sha }}"
          WEB_IMAGE="$ACR_LOGIN_SERVER/discovery-web:${{ github.sha }}"
          echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=$WEB_IMAGE" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 -t "$API_IMAGE" -f services/discovery-api/Dockerfile .
          docker build --platform linux/amd64 \
            --build-arg VITE_ENTRA_CLIENT_ID="$VITE_ENTRA_CLIENT_ID" \
            --build-arg VITE_ENTRA_TENANT_ID="$VITE_ENTRA_TENANT_ID" \
            --build-arg VITE_ENTRA_API_SCOPE="$VITE_ENTRA_API_SCOPE" \
            -t "$WEB_IMAGE" apps/discovery-web
          docker push "$API_IMAGE"
          docker push "$WEB_IMAGE"
      - name: Update the API and the web app
        if: env.MODE == 'deploy'
        run: |
          az containerapp update -n "$API_APP" -g "$RG" --image "$API_IMAGE"
          az containerapp update -n "$WEB_APP" -g "$RG" --image "$WEB_IMAGE"
