# docker-compose.yml

services:
  discovery-api:
    build:
      context: .
      dockerfile: services/discovery-api/Dockerfile
    ports:
      - "8110:8110"
    profiles: ["discovery"]

  discovery-web:
    build:
      context: apps/discovery-web
      dockerfile: Dockerfile
    ports:
      - "5175:80"
    environment:
      - DISCOVERY_API_HOST=discovery-api:8110
    depends_on:
      - discovery-api
    profiles: ["discovery"]

  # ─── Local operations plane ────────────────────────────────────────────
  # Start with: docker compose --profile observability up -d

networks:
  rag-network:
    driver: bridge

volumes:
  pg_data:
  qdrant_data:
  neo4j_data:
  opensearch_data:
  prometheus_data:
  grafana_data:
